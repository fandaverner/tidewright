<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tidewright</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2433">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 40%,#2b6f8f 0%,#17435a 55%,#0b2433 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f6efdc}
#hud{height:56px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:6px}
.pill{background:rgba(8,28,40,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 11px;display:flex;align-items:center;gap:7px;font-size:13px;color:#f6efdc;font-family:inherit}
#tideArrow{display:inline-block;transition:transform .6s cubic-bezier(.5,1.6,.5,1);font-size:17px;color:#9fe0f7;font-weight:700}
#tideBar{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#tideFill{height:100%;background:linear-gradient(90deg,#6fcbed,#e8f7ff);width:0}
#mid{display:flex;flex-direction:column;align-items:center;line-height:1.15}
#modeTag{font-size:11px;font-weight:700;letter-spacing:.5px;color:#cfe9f5}
#modeTag .x{color:#ff9a7a}
#saveNote{font-size:10.5px;opacity:0;transition:opacity .4s;color:#bfe9c4}
#resBtn{position:relative}
#resBadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#f2c14e;color:#2a1c0a;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
#wrap{display:flex;justify-content:center}
#banner{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:7px 14px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;max-width:92%;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#banner.warn{background:#f2c14e;color:#2a1c0a}
#banner.on{background:#c0392b;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
#hint{position:fixed;left:8px;right:8px;bottom:80px;z-index:4;text-align:center;font-size:12.5px;line-height:1.5;padding:5px 10px;border-radius:10px;background:rgba(8,28,40,.78);border:1px solid rgba(255,255,255,.1);pointer-events:none}
canvas{display:block;touch-action:none;filter:drop-shadow(0 10px 20px rgba(0,0,0,.45))}
#tools{position:fixed;left:0;right:0;bottom:0;overflow-x:auto;padding:10px 8px;background:linear-gradient(180deg,rgba(9,28,40,0),rgba(9,28,40,.92) 35%);touch-action:pan-x;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tb{display:flex;gap:6px;width:max-content;margin:0 auto}
.tool{flex:0 0 62px;border-radius:14px;padding:6px 2px 5px;background:rgba(255,255,255,.08);color:#f6efdc;font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid rgba(255,255,255,.12);transition:transform .1s}
.tool:active{transform:scale(.94)}
.tool svg{width:24px;height:24px}
.tool.on{background:#f2c14e;color:#2a1c0a;border-color:#ffe08a;box-shadow:0 0 0 3px rgba(242,193,78,.3)}
.tool.empty{opacity:.45}
.tool .n{font-size:10px;opacity:.75}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,18,26,.6)}
.card{background:linear-gradient(180deg,#f7ecd0,#e9d6a8);color:#3a2a14;border-radius:18px;padding:20px 20px 16px;max-width:380px;width:calc(100% - 28px);box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center;max-height:calc(100% - 40px);overflow-y:auto;touch-action:pan-y}
.card h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px;color:#1f4f66}
.card h2{margin:0 0 10px;font-size:20px;color:#1f4f66}
.card p{margin:0 0 8px;font-size:14px;line-height:1.45;text-align:left}
.btn{margin:8px 4px 0;border:0;border-radius:12px;padding:11px 22px;font:inherit;font-size:15px;font-weight:700;background:#1f6f91;color:#fff}
.btn.sec{background:rgba(31,111,145,.15);color:#1f4f66}
.btn:disabled{opacity:.35}
#mBtns{display:flex;flex-direction:column;gap:7px;margin-top:10px}
#mBtns .btn{margin:0;width:100%}
.stock{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.55);border-radius:999px;padding:3px 8px 3px 5px;font-size:12px}
.chip i,.ic i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.3)}
.chip.ok{background:#cfe9c8}.chip.no{background:#f3cfc4}
.ic{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tm{opacity:.65;font-size:11.5px}
.tech{text-align:left;background:rgba(255,255,255,.45);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tech.done{opacity:.55}
.tech b{font-size:15px}
.tech .d{font-size:12.5px;margin:3px 0 6px;line-height:1.35}
.tech .g{font-size:12px;margin:-2px 0 6px;color:#2f6b3a}
.tech .row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.tech .btn{margin:0;padding:7px 14px;font-size:13px}
.resHead{position:sticky;top:-20px;margin:-20px -20px 10px;padding:14px 16px 10px 20px;background:#f7ecd0;display:flex;align-items:center;justify-content:space-between;border-radius:18px 18px 0 0;z-index:1}
.resHead h2{margin:0}
#resX{border:0;background:rgba(31,111,145,.15);color:#1f4f66;width:36px;height:36px;border-radius:50%;font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:6px 0 4px}
.grid button{border:0;border-radius:10px;padding:11px 0;font:inherit;font-weight:700;font-size:15px;background:#1f6f91;color:#fff}
.grid button.old{background:rgba(31,111,145,.22);color:#1f4f66}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0}
.pick button{border:0;border-radius:10px;padding:10px 8px;font:inherit;font-size:14px;background:rgba(255,255,255,.6);color:#3a2a14;display:flex;align-items:center;gap:7px;justify-content:center}
.pick button.on{background:#f2c14e;font-weight:700}
.pick i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.3)}
.story{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#4a3820}
.story p{font-size:15px;line-height:1.55;margin-bottom:10px}
.story b{font-style:normal;letter-spacing:.5px;color:#1f4f66}
.story .end{text-align:center;font-size:19px;font-style:normal;font-weight:700;color:#c0392b;margin:4px 0 12px}
.meta{font-size:12.5px!important;opacity:.75;text-align:center!important;border-top:1px solid rgba(58,42,20,.15);padding-top:8px}
.help{text-align:left}
.help h3{margin:14px 0 6px;font-size:16px;color:#1f4f66}
.help h3:first-child{margin-top:2px}
.help p,.help li{font-size:13.5px;line-height:1.5}
.help ol,.help ul{margin:0 0 6px;padding-left:20px}
.help li{margin-bottom:5px}
.rec,.path div{background:rgba(255,255,255,.45);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.55}
</style>
</head>
<body>
<div id="hud">
  <div class="pill"><span id="tideArrow">→</span><div id="tideBar"><div id="tideFill"></div></div><span id="tideTxt"></span></div>
  <div id="mid"><span id="modeTag"></span><span id="saveNote">Uloženo</span></div>
  <div style="display:flex;gap:6px"><button class="pill" id="resBtn">Výzkum<span id="resBadge"></span></button><button class="pill" id="menuBtn" aria-label="Menu" style="padding:6px 10px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
</div>
<div id="banner"></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint"></div>
<div id="tools"><div id="tb"></div></div>
<div class="ov" id="msg"><div class="card"><h1 id="mTitle"></h1><div id="mBody"></div><div id="mBtns"></div></div></div>
<div class="ov" id="res"><div class="card"><div class="resHead"><h2>Výzkum</h2><button id="resX" aria-label="Zavřít">✕</button></div><p id="resNote" style="display:none;font-size:12.5px">Expert: maják přijme jen suroviny, které některý výzkum ještě potřebuje. Ostatní ucpou kanál.</p><div class="stock" id="stock"></div><div id="techList"></div><p style="font-size:12px;opacity:.7;text-align:center">Recepty všech budov najdeš v Návodu (menu ☰).</p></div></div>
<script>
const STEP=0.5,PHASE=8,SAVE_KEY='tidewright-v3';
let COLS=10,ROWS=13,LAMP=[8,11];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const ITEMS={jil:'Jíl',pisek:'Písek',rasa:'Řasa',palivo:'Palivo',cihla:'Cihla',sklo:'Sklo',sul:'Sůl',dynamit:'Dynamit'};
const ICOL={jil:'#8a5634',pisek:'#e9d79a',rasa:'#4f9a55',palivo:'#5b3a22',cihla:'#d0533c',sklo:'#9fd8ea',sul:'#ffffff',dynamit:'#c0392b'};
const RECIPES={kiln:{in:{jil:1},out:'cihla',t:2},dryer:{in:{rasa:1},out:'palivo',t:2},glass:{in:{pisek:2,palivo:1},out:'sklo',t:3},salt:{in:{rasa:1},out:'sul',t:3},powder:{in:{palivo:1,sul:1},out:'dynamit',t:4}};
const BUILD={
 kanal:{kind:'canal',label:'Kanál'},
 hraz:{kind:'hraz',label:'Hráz'},
 sberac:{kind:'drill',label:'Sběrač'},
 pec:{kind:'kiln',label:'Pec'},
 susarna:{kind:'dryer',label:'Sušárna'},
 tridic:{kind:'sort',label:'Třídič'},
 sklad:{kind:'store',label:'Sklad'},
 rozdelovac:{kind:'split',label:'Rozdělovač'},
 pumpa:{kind:'pump',label:'Pumpa'},
 sklarna:{kind:'glass',label:'Sklárna'},
 solnicka:{kind:'salt',label:'Solnička'},
 pracharna:{kind:'powder',label:'Prachárna'}
};
const TOOL_ORDER=['kanal','hraz','sberac','pec','dynamit','susarna','tridic','sklad','rozdelovac','pumpa','sklarna','solnicka','pracharna','smazat'];
const BASE_TOOLS={kanal:1,hraz:1,sberac:1,pec:1,dynamit:1,smazat:1};
const START={std:L=>({kanal:20+2*L,hraz:2,sberac:2,pec:1,dynamit:2}),exp:L=>({kanal:15+2*L,hraz:1,sberac:2,pec:1,dynamit:1})};
const TECH=[
 {id:'suseni',name:'Sušení',desc:'Sušárna suší řasu na palivo.',cost:{cihla:3},req:[],give:{susarna:2,kanal:10,sberac:1}},
 {id:'trideni',name:'Třídění',desc:'Třídič pošle zvolenou surovinu dolů a vše ostatní doprava. Sklad podrží zboží.',cost:{cihla:5},req:[],give:{tridic:3,sklad:1,kanal:10}},
 {id:'trhaci',name:'Trhací práce',desc:'Prachárna vyrábí dynamit z paliva a soli. Dynamit doveď k majáku a připíše se ti do zásoby.',cost:{cihla:4,palivo:2},req:['sul'],give:{'pracharna':1,dynamit:1}},
 {id:'sklo',name:'Sklo',desc:'Sklárna taví písek s palivem na sklo.',cost:{cihla:5,palivo:3},req:['suseni','trideni'],give:{sklarna:1,sberac:1,kanal:10}},
 {id:'sul',name:'Sůl',desc:'Solnička odpařuje sůl z řasy.',cost:{palivo:5},req:['suseni'],give:{solnicka:1,kanal:10}},
 {id:'cerpani',name:'Čerpání',desc:'Pumpa tlačí zboží nahoru, ale jen když proud teče doprava.',cost:{cihla:4,palivo:2},req:['trideni'],give:{pumpa:6,kanal:6},minLevel:4},
 {id:'deleni',name:'Rozdělování',desc:'Rozdělovač posílá zboží střídavě doprava a dolů.',cost:{jil:6},req:['trideni'],give:{rozdelovac:2,hraz:1}},
 {id:'majak',name:'Rozsvítit maják',desc:'Cíl levelu. Maják se rozsvítí a povede lodě domů.',cost:{cihla:5,sklo:5,sul:5},req:['sklo','sul']}
];
const P='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const ICON={
 kanal:P+'<path d="M3 8c3-2 6 2 9 0s6-2 9 0M3 13c3-2 6 2 9 0s6-2 9 0M3 18c3-2 6 2 9 0s6-2 9 0"/></svg>',
 hraz:P+'<path d="M5 3v18M19 3v18M5 9h14M5 14h14"/></svg>',
 sberac:P+'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 4v6M12 14v6M4 12h6M14 12h6"/></svg>',
 pec:P+'<path d="M3 20h18M5 20v-6a7 7 0 0 1 14 0v6M10 20v-4a2 2 0 0 1 4 0v4M15 5v4"/></svg>',
 dynamit:P+'<rect x="6" y="10" width="11" height="11" rx="2"/><path d="M11.5 10V7c0-2 2-4 5-4"/><path d="M19 2l1 1M20.5 5h1.5M18 1v1"/></svg>',
 susarna:P+'<path d="M4 4v16M20 4v16M4 6h16M7 6v8M11 6v10M15 6v7M18 6v9"/></svg>',
 tridic:P+'<path d="M3 8h17M17 5l3 3-3 3M10 8v12M7 17l3 3 3-3"/><circle cx="10" cy="8" r="2.2" fill="currentColor"/></svg>',
 sklad:P+'<path d="M3 10l9-6 9 6v10H3z"/><path d="M8 20v-6h8v6M8 14l8 6M16 14l-8 6"/></svg>',
 rozdelovac:P+'<path d="M4 6h7a4 4 0 0 1 4 4v10M11 6h9M17 3l3 3-3 3M12 17l3 3 3-3"/></svg>',
 sklarna:P+'<path d="M10 3h4M11 3v6l-5 9a2 2 0 0 0 2 3h8a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/></svg>',
 solnicka:P+'<path d="M12 3l5 6-5 12-5-12z"/><path d="M7 9h10"/></svg>',
 'pracharna':P+'<path d="M4 21V11l8-5 8 5v10z"/><path d="M9 21v-5h6v5"/><path d="M12 6V3M12 3l2-1"/></svg>',
 pumpa:P+'<path d="M7 21V9M17 21V9M7 21h10"/><path d="M12 18V6M8.5 9.5L12 6l3.5 3.5"/><path d="M4 5l5-2"/></svg>',
 smazat:P+'<path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const DESC={
 kanal:'Vede zboží ve směru proudu. Táhni prstem.',
 hraz:'Kanál, který jde zavřít. Postav ji na prázdné místo nebo rovnou na kanál.',
 sberac:'Stav jen na ložisko. Každé 2,5 s vytěží 1 kus suroviny.',
 dynamit:'Klepni na skálu a odpálíš ji.',
 tridic:'Po postavení vybereš surovinu, která odbočí dolů. Ostatní jedou doprava.',
 sklad:'Podrží až 12 kusů zboží a pouští je dál po proudu.',
 rozdelovac:'Posílá zboží střídavě doprava a dolů, nezávisle na proudu.',
 pumpa:'Tlačí zboží nahoru, ale jen když proud teče doprava. Na vyšší výstup postav víc pump nad sebe.',
 smazat:'Odstraní budovu nebo kanál, vrátí se ti do zásoby.'
};
const WET={canal:1,hraz:1,drill:1,kiln:1,lamp:1,dryer:1,glass:1,salt:1,store:1,split:1,sort:1,pump:1,powder:1};
const WATERK={canal:1,hraz:1,pump:1};
const KIND2TOOL={};for(const k in BUILD)KIND2TOOL[BUILD[k].kind]=k;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
let T=30,O=10,W=0,H=0,dpr=1,bg=null,shake=0;
let mode='std',level=1,seed=1,profile={expert:false,lvl:{std:1,exp:1}};
let storm={next:60,on:0},paused=false;
let grid,budget,techs,stock,tool=null,flow=0,dx=1,dy=0,phaseT=0,stepT=0,won=false,running=false,painting=false,lamp=null,time=0,parts=[];

function rnd(x,y,i){let h=(x*374761393+y*668265263+i*362437)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function at(x,y){return(x>=0&&y>=0&&x<COLS&&y<ROWS)?grid[y][x]:null;}
function blank(){return{ore:null,rock:false,crater:false,kind:null,open:true,item:null,ox:0,oy:0,buf:0,prog:0,inv:{},out:0,q:[],alt:0,filter:null,fuse:0,pt:null};}
function clearTile(t){const o=t.ore,r=t.rock,c=t.crater;Object.assign(t,blank());t.ore=o;t.rock=r;t.crater=c;}
function toolName(id){return id==='dynamit'?'Dynamit':id==='smazat'?'Smazat':BUILD[id].label;}
function available(id){return !!BASE_TOOLS[id]||TECH.some(tc=>techs[tc.id]&&tc.give&&tc.give[id]);}
function techOf(id){return TECH.find(tc=>tc.give&&tc.give[id]);}
function techList(){return TECH.filter(tc=>!tc.minLevel||level>=tc.minLevel);}
function costOf(tc){const c={};if(tc.id==='majak'){for(const k in tc.cost)c[k]=4+level;return c;}const f=1+0.12*(level-1);for(const k in tc.cost)c[k]=Math.round(tc.cost[k]*f);return c;}

/* ---------- map generator ---------- */
function dims(L){return[Math.min(14,9+L),Math.min(19,12+L)];}
function reach(cells,rockSet,C,R,lx,ly,up){
  const mv=up?[[1,0],[0,1],[0,-1]]:[[1,0],[0,1]];
  const seen=new Set(cells.map(([x,y])=>x+','+y)),st=cells.map(([x,y])=>[x,y]);
  while(st.length){const[x,y]=st.pop();if(x===lx&&y===ly)return true;
    for(const[a,b]of mv){const nx=x+a,ny=y+b,k=nx+','+ny;if(nx>=C||ny>=R||ny<0||seen.has(k)||rockSet.has(k))continue;seen.add(k);st.push([nx,ny]);}}
  return false;
}
function genMap(L,sd,m){
  const[C,R]=dims(L),pumpLvl=L>=4,lx=C-2,ly=pumpLvl?Math.floor(R/2)-1:R-2,key=(x,y)=>x+','+y;
  const ridge=[];
  for(let y=ly-2;y<=Math.min(R-1,ly+2);y++)ridge.push([lx-2,y]);
  for(let x=lx-1;x<C;x++){ridge.push([x,ly-2]);if(ly+2<R)ridge.push([x,ly+2]);}
  const zone={jil:[0,lx-4,0,ly-4],rasa:[0,lx-4,0,ly-4],pisek:pumpLvl?[0,lx-4,ly+3,Math.min(R-1,ly+5)]:[0,lx-4,0,ly-4]};
  let fallback=null;
  for(let attempt=0;attempt<300;attempt++){
    const r=rng(sd*7919+attempt*104729+L*31);
    const occ=new Set(),ores=[];
    ridge.forEach(([x,y])=>occ.add(key(x,y)));
    for(let y=ly-1;y<=Math.min(R-1,ly+1);y++)for(let x=lx-1;x<C;x++)occ.add(key(x,y));
    const size=L<=3?4:3;let ok=true;
    for(const k of['jil','pisek','rasa']){
      const[x0,x1,y0,y1]=zone[k];let placed=false;
      for(let tr=0;tr<80&&!placed;tr++){
        const sx=x0+Math.floor(r()*(x1-x0+1)),sy=y0+Math.floor(r()*(y1-y0+1));
        const cells=[[sx,sy]],cs=new Set([key(sx,sy)]);
        for(let g=0;g<40&&cells.length<size;g++){const[bx,by]=cells[Math.floor(r()*cells.length)],[a,b]=DIRS[Math.floor(r()*4)],nx=bx+a,ny=by+b;
          if(nx<x0||ny<y0||nx>x1||ny>y1||cs.has(key(nx,ny)))continue;cells.push([nx,ny]);cs.add(key(nx,ny));}
        if(cells.length<size)continue;
        let clash=false;for(const[x,y]of cells)for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(occ.has(key(x+a,y+b)))clash=true;
        if(clash)continue;
        cells.forEach(([x,y])=>{occ.add(key(x,y));ores.push([x,y,k]);});placed=true;
      }
      if(!placed){ok=false;break;}
    }
    if(!ok)continue;
    if(!fallback)fallback={cols:C,rows:R,lamp:[lx,ly],ores,rocks:ridge.slice()};
    const rocks=ridge.slice(),rockSet=new Set();
    const n=Math.min((m==='exp'?6:3)+3*L,Math.floor(C*R*0.16));
    for(let i=0,tr=0;i<n&&tr<600;tr++){const x=Math.floor(r()*C),y=Math.floor(r()*R);if(occ.has(key(x,y)))continue;occ.add(key(x,y));rocks.push([x,y]);rockSet.add(key(x,y));i++;}
    if(['jil','pisek','rasa'].every(k=>reach(ores.filter(o=>o[2]===k),rockSet,C,R,lx,ly,pumpLvl&&k==='pisek')))return{cols:C,rows:R,lamp:[lx,ly],ores,rocks};
  }
  return fallback;
}

/* ---------- game setup ---------- */
function emptyGrid(){grid=[];for(let y=0;y<ROWS;y++){const row=[];for(let x=0;x<COLS;x++)row.push(blank());grid.push(row);}}
function newGame(m,L,sd){
  mode=m;level=L;seed=sd;
  const map=genMap(L,sd,m);COLS=map.cols;ROWS=map.rows;LAMP=map.lamp;
  emptyGrid();
  map.ores.forEach(([x,y,k])=>{grid[y][x].ore=k;});
  map.rocks.forEach(([x,y])=>{grid[y][x].rock=true;});
  lamp=grid[LAMP[1]][LAMP[0]];lamp.kind='lamp';
  budget={};TOOL_ORDER.forEach(k=>budget[k]=0);Object.assign(budget,START[m](L));
  techs={};stock={};for(const k in ITEMS)stock[k]=0;
  flow=0;setDir();phaseT=0;stepT=0;won=false;parts=[];tool=null;
  storm={next:50+Math.random()*30,on:0};
  afterLoad();
}
function afterLoad(){resize();buildTools();updateBadge();updateTag();}
function setDir(){dx=flow===0?1:0;dy=flow===1?1:0;}
function updateTag(){$('modeTag').innerHTML='Level '+level+(mode==='exp'?' <span class="x">EXPERT</span>':'');}

function buildTools(){
  const el=$('tb');el.innerHTML='';
  if(tool&&!available(tool))tool=null;
  TOOL_ORDER.filter(available).forEach(id=>{
    const b=document.createElement('button');
    b.className='tool'+(id===tool?' on':'')+(id!=='smazat'&&!budget[id]?' empty':'');
    b.innerHTML=ICON[id]+'<span>'+toolName(id)+'</span><span class="n">'+(id==='smazat'?'&nbsp;':budget[id]+' ks')+'</span>';
    b.onclick=()=>{tool=tool===id?null:id;buildTools();};el.appendChild(b);
  });
  $('hint').innerHTML=hintFor(tool);
}
function ichip(k,n){return'<span class="ic"><i style="background:'+ICOL[k]+'"></i>'+n+'× '+ITEMS[k]+'</span>';}
function recipeHtml(kind){const r=RECIPES[kind];return Object.keys(r.in).map(k=>ichip(k,r.in[k])).join(' + ')+' → '+ichip(r.out,1)+' <span class="tm">('+r.t+' s)</span>';}
function hintFor(id){
  if(!id)return'Vyber nástroj dole. Bez nástroje klepnutím na políčko zjistíš, co na něm je.';
  const b=BUILD[id];
  let txt=b&&RECIPES[b.kind]?recipeHtml(b.kind):DESC[id];
  if(id==='smazat'&&mode==='exp')txt='Odstraní budovu. V expertu propadne, vrátí se jen do 2 s po položení.';
  return'<b>'+toolName(id)+':</b> '+txt;
}
function puff(x,y,c,n,o){o=o||{};for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(o.sp||1.2),vy:o.up?-(0.3+Math.random()*0.4):(Math.random()-.5)*(o.sp||1.2),life:0,max:(o.max||0.6)+Math.random()*0.5,r:(o.r||0.05)+Math.random()*0.05,c,grow:o.grow});}

/* ---------- simulation ---------- */
function lampNeed(item){let n=0;for(const tc of techList())if(!techs[tc.id]){const c=costOf(tc);if(c[item])n+=c[item];}return n;}
function accepts(t,item){
  if(!t)return false;
  const r=RECIPES[t.kind];
  if(r){const need=r.in[item];return !!need&&(t.inv[item]||0)<need*2;}
  switch(t.kind){
    case'canal':case'pump':return t.item===null;
    case'hraz':return t.open&&t.item===null;
    case'store':return t.q.length<12;
    case'split':case'sort':return t.q.length<1;
    case'lamp':return item==='dynamit'||mode!=='exp'||(stock[item]||0)<lampNeed(item);
    default:return false;
  }
}
function give(t,item,x,y,ddx,ddy){
  if(t.kind==='canal'||t.kind==='hraz'||t.kind==='pump'){t.item=item;t.ox=-ddx;t.oy=-ddy;}
  else if(RECIPES[t.kind])t.inv[item]=(t.inv[item]||0)+1;
  else if(t.kind==='store'||t.kind==='split'||t.kind==='sort')t.q.push(item);
  else if(t.kind==='lamp'){if(item==='dynamit'){budget.dynamit=(budget.dynamit||0)+1;buildTools();puff(x+0.5,y-0.1,'255,120,80',8,{sp:1.6});}else{stock[item]=(stock[item]||0)+1;puff(x+0.5,y-0.1,'255,224,120',6,{sp:1.4});updateBadge();}}
}
function push(x,y,item,ddx,ddy){const n=at(x+ddx,y+ddy);if(n&&n.kind==='pump'&&ddy===1)return false;if(accepts(n,item)){give(n,item,x+ddx,y+ddy,ddx,ddy);return true;}return false;}
function step(){
  const order=[];
  if(flow===0){for(let y=0;y<ROWS;y++)for(let x=COLS-1;x>=0;x--)order.push([x,y]);}
  else{for(let y=ROWS-1;y>=0;y--)for(let x=0;x<COLS;x++)order.push([x,y]);}
  for(const[x,y]of order){
    const t=grid[y][x];
    if(t.item&&(t.kind==='canal'||t.kind==='hraz')){
      if(t.kind==='hraz'&&!t.open)continue;
      if(push(x,y,t.item,dx,dy)){t.item=null;t.ox=t.oy=0;}
    }
    else if(t.item&&t.kind==='pump'&&flow===0){if(push(x,y,t.item,0,-1)){t.item=null;t.ox=t.oy=0;}}
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=grid[y][x];
    if(t.kind==='drill'&&t.buf>0){if(push(x,y,t.ore,dx,dy))t.buf--;}
    else if(RECIPES[t.kind]&&t.out>0){if(push(x,y,RECIPES[t.kind].out,dx,dy))t.out--;}
    else if(t.kind==='store'&&t.q.length){if(push(x,y,t.q[0],dx,dy))t.q.shift();}
    else if(t.kind==='sort'&&t.q.length){const it=t.q[0],down=it===t.filter;if(push(x,y,it,down?0:1,down?1:0))t.q.shift();}
    else if(t.kind==='split'&&t.q.length){
      const first=t.alt?[0,1]:[1,0],second=t.alt?[1,0]:[0,1];
      if(push(x,y,t.q[0],first[0],first[1])){t.q.shift();t.alt^=1;}
      else if(push(x,y,t.q[0],second[0],second[1]))t.q.shift();
    }
  }
}
function canCraft(t){const r=RECIPES[t.kind];if(t.out>=2)return false;for(const k in r.in)if((t.inv[k]||0)<r.in[k])return false;return true;}
function produce(dt){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=grid[y][x];
    if(t.kind==='drill'){t.prog+=dt;if(t.prog>=2.5){t.prog=0;if(t.buf<3){t.buf++;puff(x+0.5,y+0.75,'150,100,65',4,{sp:1});}}}
    const r=RECIPES[t.kind];
    if(r){
      if(canCraft(t)){
        t.prog+=dt;
        if((t.kind==='kiln'||t.kind==='glass')&&Math.random()<dt*5)puff(x+0.66,y+0.05,'215,215,215',1,{up:true,sp:0.25,max:1.2,r:0.06,grow:true});
        if(t.prog>=r.t){t.prog=0;for(const k in r.in)t.inv[k]-=r.in[k];t.out++;puff(x+0.5,y+0.7,t.kind==='kiln'||t.kind==='glass'?'255,170,70':'240,240,220',6,{sp:1});}
      }else t.prog=0;
    }
    if(t.fuse>0){
      t.fuse-=dt;if(Math.random()<dt*25)puff(x+0.62,y+0.18,'255,210,90',1,{sp:1.5,max:0.25,r:0.02});
      if(t.fuse<=0){t.fuse=0;t.rock=false;t.crater=true;shake=0.5;
        puff(x+0.5,y+0.5,'255,170,60',14,{sp:3,max:0.4});puff(x+0.5,y+0.5,'150,150,150',16,{sp:2.2,max:0.9,r:0.08});buildBg();}
    }
  }
}
function protectedNets(){
  const id=new Map(),safe=[];let c=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=grid[y][x];if(!WATERK[t.kind]||id.has(t))continue;
    let s=false;const st=[[x,y]];id.set(t,c);
    while(st.length){const[a,b]=st.pop(),u=grid[b][a];if(u.kind==='hraz'&&!u.open)s=true;
      for(const[p,q]of DIRS){const n=at(a+p,b+q);if(n&&WATERK[n.kind]&&!id.has(n)){id.set(n,c);st.push([a+p,b+q]);}}}
    safe[c++]=s;
  }
  return t=>safe[id.get(t)];
}
function stormTick(dt){
  if(mode!=='exp')return;
  if(storm.on>0){
    storm.on-=dt;const isSafe=protectedNets();
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const t=grid[y][x];
      if(t.item&&WATERK[t.kind]&&!isSafe(t)&&Math.random()<dt*0.25){t.item=null;puff(x+0.5,y+0.5,'210,240,255',8,{sp:1.6});}}
    if(storm.on<=0){storm.on=0;storm.next=45+Math.random()*30;}
  }else{storm.next-=dt;if(storm.next<=0)storm.on=10;}
}
function tick(dt){
  phaseT+=dt;if(phaseT>=PHASE){phaseT-=PHASE;flow=1-flow;setDir();}
  stepT+=dt;while(stepT>=STEP){stepT-=STEP;step();}
  produce(dt);stormTick(dt);
  const s=dt/STEP;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const t=grid[y][x];if(!t.item)continue;
    if(t.ox)t.ox=t.ox>0?Math.max(0,t.ox-s):Math.min(0,t.ox+s);
    if(t.oy)t.oy=t.oy>0?Math.max(0,t.oy-s):Math.min(0,t.oy+s);}
}

/* ---------- input ---------- */
function act(e,fresh){
  if(won||!running||paused)return;
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left-O)/T),y=Math.floor((e.clientY-r.top-O)/T);
  const t=at(x,y);if(!t)return;
  if(!tool){if(fresh){inspect(t);if(t.kind==='hraz'){t.open=!t.open;puff(x+0.5,y+0.5,'200,235,255',6);}else if(t.kind==='sort')pickFilter(t);}return;}
  if(t.kind==='lamp')return;
  if(tool==='dynamit'){
    if(fresh&&t.rock&&!t.fuse&&budget.dynamit>0){budget.dynamit--;t.fuse=1.2;buildTools();}
    return;
  }
  if(tool==='smazat'){
    if(!fresh)return;
    const k=KIND2TOOL[t.kind];
    if(k){const refund=mode!=='exp'||(t.pt!=null&&time-t.pt<2);if(refund)budget[k]++;
      clearTile(t);puff(x+0.5,y+0.5,refund?'240,225,190':'120,90,60',8);buildTools();}
    return;
  }
  if(tool==='hraz'&&t.kind==='hraz'){if(fresh){t.open=!t.open;puff(x+0.5,y+0.5,'200,235,255',6);}return;}
  if(tool==='hraz'&&t.kind==='canal'){
    if(!fresh||budget.hraz<=0)return;
    t.kind='hraz';t.open=true;t.pt=time;budget.hraz--;budget.kanal++;
    puff(x+0.5,y+0.5,'200,235,255',6);buildTools();return;
  }
  if(tool==='tridic'&&t.kind==='sort'){if(fresh)pickFilter(t);return;}
  const b=BUILD[tool];if(!b||t.kind!==null||t.rock||budget[tool]<=0)return;
  if(b.kind==='drill'&&!t.ore)return;
  if(!fresh&&tool!=='kanal')return;
  clearTile(t);t.kind=b.kind;budget[tool]--;t.pt=time;
  puff(x+0.5,y+0.5,'240,225,190',6);buildTools();
  if(b.kind==='sort'){painting=false;pickFilter(t);}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();painting=true;act(e,true);});
cv.addEventListener('pointermove',e=>{if(painting&&tool==='kanal')act(e,false);});
addEventListener('pointerup',()=>{painting=false;});
addEventListener('pointercancel',()=>{painting=false;});

function inspect(t){
  let h='';
  if(t.kind==='lamp')h='<b>Maják.</b> Sem doveď suroviny. Uloží se do zásob a za ně vyzkoumáš budovy (tlačítko Výzkum).';
  else if(t.rock)h='<b>Skála.</b> Nejde na ni stavět. Odpal ji nástrojem Dynamit.';
  else if(t.kind==='drill')h='<b>Sběrač</b> na ložisku: '+ichip(t.ore,1)+' každé 2,5 s.';
  else if(t.kind==='hraz')h='<b>Hráz.</b> Klepnutím ji otevřeš (zelená) nebo zavřeš (červená).';
  else if(t.kind==='sort')h='<b>Třídič.</b> Dolů posílá: '+(t.filter?ichip(t.filter,1).replace('1× ',''):'nic')+'. Ostatní jede doprava.';
  else if(t.kind){const id=KIND2TOOL[t.kind],b=BUILD[id];h='<b>'+b.label+'.</b> '+(RECIPES[t.kind]?recipeHtml(t.kind):DESC[id]||'');
    if(t.item)h+=' Veze: '+ITEMS[t.item]+'.';}
  else if(t.ore)h='<b>Ložisko: '+ITEMS[t.ore]+'</b> <span class="ic"><i style="background:'+ICOL[t.ore]+'"></i></span>. Postav sem <b>Sběrač</b> a začne těžit.';
  if(!h)return;
  $('hint').innerHTML=h;clearTimeout(inspect.h);inspect.h=setTimeout(()=>{$('hint').innerHTML=hintFor(tool);},5000);
}
function pickFilter(t){
  paused=true;
  let h='<p>Kterou surovinu má třídič poslat <b>dolů</b>? Všechno ostatní pojede <b>doprava</b>.</p><div class="pick">';
  for(const k in ITEMS)h+='<button data-k="'+k+'" class="'+(t.filter===k?'on':'')+'"><i style="background:'+ICOL[k]+'"></i>'+ITEMS[k]+'</button>';
  h+='<button data-k="" class="'+(t.filter?'':'on')+'">Nic (vše doprava)</button></div>';
  show('Třídič',h,[{label:'Hotovo',fn:()=>{paused=false;}}]);
  $('mBody').querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{t.filter=b.dataset.k||null;$('msg').style.display='none';paused=false;});
}

/* ---------- research ---------- */
function reqOk(tc){return tc.req.every(r=>techs[r]);}
function affordable(tc){const c=costOf(tc);for(const k in c)if((stock[k]||0)<c[k])return false;return true;}
function updateBadge(){
  if(!techs)return;
  const n=techList().filter(tc=>!techs[tc.id]&&reqOk(tc)&&affordable(tc)).length;
  const b=$('resBadge');b.textContent=n;b.style.display=n?'flex':'none';
  if($('res').style.display==='flex')renderRes();
}
function chip(k,txt,cls){return'<span class="chip '+(cls||'')+'"><i style="background:'+ICOL[k]+'"></i>'+ITEMS[k]+' '+txt+'</span>';}
function giveTxt(tc){return tc.give?Object.keys(tc.give).map(k=>'+'+tc.give[k]+' '+toolName(k)).join(', '):'';}
function renderRes(){
  $('resNote').style.display=mode==='exp'?'':'none';
  $('stock').innerHTML=Object.keys(ITEMS).filter(k=>k!=='dynamit').map(k=>chip(k,stock[k]||0)).join('');
  const L=$('techList');L.innerHTML='';
  techList().forEach(tc=>{
    const c=costOf(tc),d=document.createElement('div');d.className='tech'+(techs[tc.id]?' done':'');
    const costs=Object.keys(c).map(k=>chip(k,(stock[k]||0)+'/'+c[k],(stock[k]||0)>=c[k]?'ok':'no')).join(' ');
    const lockTxt=reqOk(tc)?'':'<div class="d">Nejdřív: '+tc.req.filter(r=>!techs[r]).map(r=>TECH.find(t=>t.id===r).name).join(', ')+'</div>';
    d.innerHTML='<b>'+tc.name+(techs[tc.id]?' ✓':'')+'</b><div class="d">'+tc.desc+'</div>'+(tc.give?'<div class="g">Získáš: '+giveTxt(tc)+'</div>':'')+lockTxt+'<div class="row"><div>'+(techs[tc.id]?'':costs)+'</div></div>';
    if(!techs[tc.id]){
      const btn=document.createElement('button');btn.className='btn';btn.textContent='Vyzkoumat';
      btn.disabled=!(reqOk(tc)&&affordable(tc)&&running&&!won);
      btn.onclick=()=>research(tc);d.querySelector('.row').appendChild(btn);
    }
    L.appendChild(d);
  });
}
function research(tc){
  if(techs[tc.id]||!reqOk(tc)||!affordable(tc))return;
  const c=costOf(tc);for(const k in c)stock[k]-=c[k];
  techs[tc.id]=1;
  if(tc.give)for(const k in tc.give)budget[k]=(budget[k]||0)+tc.give[k];
  buildTools();updateBadge();renderRes();
  if(tc.id==='majak'){
    won=true;$('res').style.display='none';
    const firstExp=mode==='std'&&!profile.expert;
    if(mode==='std')profile.expert=true;
    profile.lvl[mode]=Math.max(profile.lvl[mode]||1,level+1);
    saveProfile();save();
    setTimeout(()=>show('Level '+level+' dokončen!','<div class="story"><p>Světlo se rozlilo po vlnách. Někde v mlze právě jedna loď změnila kurz k domovu.</p>'+
      '<p>Dál po pobřeží ale čeká další zhasnutý maják. Útes je vyšší, skal přibylo a moře je náročnější.</p></div>'+
      (firstExp?'<p><b>Odemkl jsi Expert.</b> Maják tam přijme jen to, co výzkum potřebuje, smazaná budova propadne a chodí bouře.</p>':''),
      [{label:'Další level ('+(level+1)+')',fn:()=>startNew(mode,level+1)},{label:'Menu',fn:()=>{running=false;pending=null;showIntro();}}]),1200);
  }else save();
}
$('resBtn').onclick=()=>{if(!running)return;renderRes();$('res').style.display='flex';};
$('resX').onclick=()=>{$('res').style.display='none';};
$('res').addEventListener('click',e=>{if(e.target.id==='res')$('res').style.display='none';});

/* ---------- save / load ---------- */
let db=null,uid=null,saving=false,lastSave=0,pending=null,introOpen=false;
function serialize(){
  const g=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const t=grid[y][x],o={};
    if(t.ore)o.e=t.ore;if(t.rock)o.r=1;if(t.crater)o.c=1;
    if(t.kind&&t.kind!=='lamp')o.k=t.kind;if(!t.open)o.o=0;if(t.item)o.i=t.item;if(t.buf)o.b=t.buf;if(t.out)o.u=t.out;
    if(t.prog)o.p=+t.prog.toFixed(2);const inv={};for(const k in t.inv)if(t.inv[k])inv[k]=t.inv[k];if(Object.keys(inv).length)o.v=inv;
    if(t.q.length)o.q=t.q.slice();if(t.alt)o.a=1;if(t.filter)o.f=t.filter;if(t.fuse)o.z=+t.fuse.toFixed(2);g.push(o);}
  return{v:3,mode,level,seed,cols:COLS,rows:ROWS,lamp:LAMP.slice(),g,budget:{...budget},techs:{...techs},stock:{...stock},flow,phaseT:+phaseT.toFixed(2),won,
    storm:{next:+storm.next.toFixed(1),on:+storm.on.toFixed(1)},savedAt:Date.now()};
}
function valid(s){return s&&s.v===3&&Array.isArray(s.g)&&s.cols>4&&s.rows>4&&s.cols<=20&&s.rows<=25&&s.g.length===s.cols*s.rows&&typeof s.savedAt==='number';}
function restore(s){
  mode=s.mode==='exp'?'exp':'std';level=Math.max(1,s.level|0);seed=s.seed|0;
  COLS=s.cols;ROWS=s.rows;LAMP=(Array.isArray(s.lamp)&&s.lamp[0]<COLS&&s.lamp[1]<ROWS)?[s.lamp[0]|0,s.lamp[1]|0]:[COLS-2,ROWS-2];emptyGrid();
  s.g.forEach((o,i)=>{const t=grid[Math.floor(i/COLS)][i%COLS];
    if(o.e&&ITEMS[o.e])t.ore=o.e;t.rock=!!o.r;t.crater=!!o.c;
    if(o.k&&WET[o.k]&&o.k!=='lamp')t.kind=o.k;if(o.o===0)t.open=false;if(o.i&&ITEMS[o.i])t.item=o.i;
    t.buf=o.b||0;t.out=o.u||0;t.prog=o.p||0;if(o.v)t.inv={...o.v};if(Array.isArray(o.q))t.q=o.q.filter(k=>ITEMS[k]);t.alt=o.a?1:0;
    if(o.f&&ITEMS[o.f])t.filter=o.f;t.fuse=+o.z||0;});
  lamp=grid[LAMP[1]][LAMP[0]];lamp.kind='lamp';

    for(let i=0;i<7;i++){b.fillStyle=rnd(x,y,i+20)>0.5?'rgba(160,125,70,.22)':'rgba(255,255,255,.35)';
      b.beginPath();b.arc((x+rnd(x,y,i))*T,(y+rnd(x,y,i+9))*T,T*(0.015+rnd(x,y,i+3)*0.025),0,6.283);b.fill();}

      const sx=(x+0.2)*T,sy=(y+0.3+rnd(x,y,41)*0.4)*T;b.moveTo(sx,sy);b.quadraticCurveTo(sx+T*0.15,sy-T*0.08,sx+T*0.3,sy);b.quadraticCurveTo(sx+T*0.45,sy+T*0.08,sx+T*0.6,sy);b.stroke();}
    if(t.crater){b.fillStyle='rgba(110,80,40,.2)';b.beginPath();b.arc((x+0.5)*T,(y+0.5)*T,T*0.36,0,6.283);b.fill();
      b.fillStyle='rgba(70,50,25,.16)';b.beginPath();b.arc((x+0.5)*T,(y+0.52)*T,T*0.2,0,6.283);b.fill();}
  }
  const base={jil:'#a8673f',pisek:'#f8eecd',rasa:'#a99f76'};
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const o=grid[y][x].ore;if(!o)continue;
    b.fillStyle=base[o];
    for(let i=0;i<5;i++){b.beginPath();b.arc((x+0.25+rnd(x,y,i+50)*0.5)*T,(y+0.25+rnd(x,y,i+60)*0.5)*T,T*(0.28+rnd(x,y,i+70)*0.12),0,6.283);b.fill();}}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const o=grid[y][x].ore;if(!o)continue;
    for(let i=0;i<5;i++){const px=(x+0.15+rnd(x,y,i+80)*0.7)*T,py=(y+0.15+rnd(x,y,i+90)*0.7)*T,r=T*(0.05+rnd(x,y,i+95)*0.05);
      if(o==='jil'){b.fillStyle='#7d4527';b.beginPath();b.arc(px,py,r,0,6.283);b.fill();b.fillStyle='rgba(255,200,160,.35)';b.beginPath();b.arc(px-r*0.3,py-r*0.3,r*0.4,0,6.283);b.fill();}
      else if(o==='pisek'){b.strokeStyle='#d4ba7c';b.lineWidth=1.4;b.beginPath();b.moveTo(px-r*2,py);b.quadraticCurveTo(px,py-r*1.4,px+r*2,py);b.stroke();}
      else{b.strokeStyle=i%2?'#3f8a4a':'#5aa85c';b.lineWidth=2;b.lineCap='round';b.beginPath();b.moveTo(px,py+r*1.5);b.quadraticCurveTo(px+r*1.2,py,px-r*0.4,py-r*1.8);b.stroke();}
    }}
  b.strokeStyle='rgba(120,90,40,.07)';b.lineWidth=1;
  for(let x=1;x<COLS;x++){b.beginPath();b.moveTo(x*T,0);b.lineTo(x*T,gh);b.stroke();}
  for(let y=1;y<ROWS;y++){b.beginPath();b.moveTo(0,y*T);b.lineTo(gw,y*T);b.stroke();}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(!grid[y][x].rock)continue;
    const cx=(x+0.5)*T,cy=(y+0.5)*T;

    const pts=[];for(let i=0;i<9;i++){const a=i/9*6.283,rad=T*(0.36+rnd(x,y,i+200)*0.1);pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*0.82]);}
    b.fillStyle='#71777e';b.beginPath();pts.forEach(([a,c],i)=>i?b.lineTo(a,c):b.moveTo(a,c));b.closePath();b.fill();
    b.fillStyle='#9aa0a7';b.beginPath();pts.forEach(([a,c],i)=>{const px=cx+(a-cx)*0.78,py=cy-T*0.07+(c-cy)*0.7;i?b.lineTo(px,py):b.moveTo(px,py);});b.closePath();b.fill();
    b.fillStyle='rgba(255,255,255,.35)';b.beginPath();b.ellipse(cx-T*0.1,cy-T*0.17,T*0.1,T*0.05,-0.4,0,6.283);b.fill();

    const cells=[],st=[[x,y]];seen.add(x+','+y);
    while(st.length){const[a,c]=st.pop();cells.push([a,c]);for(const[p,q]of DIRS){const nx=a+p,ny=c+q,k=nx+','+ny;const n=at(nx,ny);if(n&&n.ore===o&&!seen.has(k)){seen.add(k);st.push([nx,ny]);}}}
    const minY=Math.min(...cells.map(c=>c[1])),top=cells.filter(c=>c[1]===minY);
    let lx=(top.reduce((s,c)=>s+c[0],0)/top.length+0.5)*T,ly=minY*T+T*0.08;

    b.fillStyle=ICOL[o];b.beginPath();b.arc(lx-w/2+fs*0.55,ly,fs*0.22,0,6.283);b.fill();
    b.fillStyle='#f6efdc';b.textAlign='center';b.textBaseline='middle';b.fillText(txt,lx+fs*0.2,ly+1);
  }
  b.restore();
}

function waterPass(e,color){

  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){

    rr(ctx,px+m-e,py+m-e,T-2*m+2*e,T-2*m+2*e,m);ctx.fill();
    for(const[a,b]of DIRS){const n=at(x+a,y+b);if(!n||!WET[n.kind])continue;

let lastFlow=-1;
function hud(){
  if(flow!==lastFlow){$('tideArrow').style.transform=flow===0?'rotate(0deg)':'rotate(90deg)';lastFlow=flow;}
  $('tideTxt').textContent=Math.ceil(PHASE-phaseT)+' s';
  $('tideFill').style.width=(phaseT/PHASE*100).toFixed(1)+'%';
  const bn=$('banner');
  if(mode==='exp'&&running&&!won&&(storm.on>0||storm.next<6)){
    bn.textContent=storm.on>0?'Bouře! Zboží v kanálech bez zavřené hráze se rozplaví ('+Math.ceil(storm.on)+' s)':'Blíží se bouře za '+Math.ceil(storm.next)+' s – zavři hráze';
    bn.className=storm.on>0?'on':'warn';bn.style.display='block';
  }else bn.style.display='none';
}
function resize(){
  const availW=innerWidth-12,availH=innerHeight-56-84-34;
  T=Math.max(16,Math.floor(Math.min(availW/(COLS+0.8),availH/(ROWS+0.8))));
  O=Math.round(T*0.4);W=T*COLS+2*O;H=T*ROWS+2*O;dpr=window.devicePixelRatio||1;
  cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;
  if(grid)buildBg();
}
function show(title,body,btns){

  btns.forEach((b,i)=>{const e=document.createElement('button');e.className='btn'+(i?' sec':'');e.textContent=b.label;if(b.disabled)e.disabled=true;

 solnicka:'Odpařuje sůl z řasy. Sůl je potřeba na maják a na dynamit.',
 'pracharna':'Vyrábí dynamit z paliva a soli. Hotový dynamit doveď kanálem k <b>majáku</b>, tam se ti připíše do zásoby nástroje Dynamit. Maják ho přijme vždy, i v expertu.',
 pumpa:'Tlačí zboží o políčko <b>nahoru</b>, ale jen když proud teče <b>doprava</b>. Když teče dolů, je proud silnější a zboží v pumpě čeká. Na vyšší výstup postav víc pump nad sebe. Hodí se i na obejití skály.'
};
function helpHtml(){
  let h='<div class="help">';
  h+='<h3>🎯 Cíl hry</h3><p>Jsi stavitel na přílivovém pobřeží. V každém levelu musíš <b>rozsvítit maják</b>, aby lodě našly cestu domů. K tomu k němu dopravíš cihly, sklo a sůl a cestou vyzkoumáš budovy, které je umí vyrobit.</p>';
  h+='<h3>🗺️ Co je na mapě</h3><div class="rec">'+
   '<div>'+ichip('jil',1).replace('1× ','')+' – hnědé hroudy, z jílu se pálí <b>cihly</b>.</div>'+
   '<div>'+ichip('pisek',1).replace('1× ','')+' – světlé duny, z písku se taví <b>sklo</b>.</div>'+
   '<div>'+ichip('rasa',1).replace('1× ','')+' – zelené chomáče, z řasy je <b>palivo</b> a <b>sůl</b>.</div>'+
   '<div><b>Šedé balvany</b> – skály, odstraníš je jen dynamitem.</div>'+
   '<div><b>Červenobílá věž</b> vpravo – maják, cíl všech surovin.</div>'+
   '<div style="margin-top:4px" class="tm">Každé ložisko má na mapě štítek se jménem. Když klepneš na políčko bez vybraného nástroje, dole se ukáže, co na něm je.</div></div>';
  h+='<h3>⚙️ Jak to funguje</h3><ol>'+
   '<li><b>Těžba.</b> Na mapě jsou tři ložiska: hnědý <b>jíl</b>, světlý <b>písek</b> a zelená <b>řasa</b>. Na ložisko postav <b>Sběrač</b>.</li>'+
   '<li><b>Kanály.</b> Suroviny vedou kanály. Budovy posílají zboží na sousední políčko po proudu, takže kanál musí začínat hned vedle nich.</li>'+
   '<li><b>Příliv.</b> Proud teče vždy jen <b>doprava</b>, nebo <b>dolů</b>. Každých 8 s se otočí (šipka a odpočet nahoře). Zboží na úseku, který vede jinam, počká. Kanály proto veď <b>schodovitě</b>.</li>'+
   '<li><b>Výroba.</b> Budova přijme jen suroviny ze svého receptu. Cokoliv jiného zůstane stát před ní a <b>ucpe kanál</b>. Na míchané kanály proto použij <b>Třídič</b>.</li>'+
   '<li><b>Skály a dynamit.</b> Na skálu nejde stavět. Maják je vždy obehnaný <b>skalním hřebenem</b>, takže si k němu musíš cestu prostřílet dynamitem.</li>'+
   '<li><b>Maják a výzkum.</b> Zboží dovezené k majáku se uloží do jeho zásob. Za ně v okně <b>Výzkum</b> odemykáš budovy a <b>dostáváš další kanály a stavby</b>. Na začátku máš jen málo.</li></ol>';
  h+='<h3>🔬 Postup výzkumu</h3><p style="font-size:12.5px">Ceny platí pro level 1, s každým levelem mírně rostou.</p><div class="path">';
  const saved=level;level=1;
  TECH.forEach(tc=>{const c=costOf(tc);h+='<div><b>'+tc.name+'</b>'+(tc.minLevel?' <span class="tm">od levelu '+tc.minLevel+'</span>':'')+(tc.req.length?' <span class="tm">po: '+tc.req.map(r=>TECH.find(t=>t.id===r).name).join(' + ')+'</span>':'')+'<br>'+Object.keys(c).map(k=>ichip(k,c[k])).join(' ')+(tc.give?'<br><span style="color:#2f6b3a">Získáš: '+giveTxt(tc)+'</span>':'')+'</div>';});
  level=saved;
  h+='</div>';
  h+='<h3>🏗️ Budovy</h3>';
  const st=START.std(1);
  ['kanal','hraz','sberac','pec','dynamit','susarna','tridic','sklad','rozdelovac','pumpa','sklarna','solnicka','pracharna'].forEach(id=>{
    const tc=techOf(id),b=BUILD[id];
    const from=BASE_TOOLS[id]?'od začátku ('+st[id]+' ks)':'odemkne: '+tc.name+(tc.minLevel?' (od levelu '+tc.minLevel+')':'');
    h+='<div class="rec"><b>'+toolName(id)+'</b> <span class="tm">'+from+'</span>'+(b&&RECIPES[b.kind]?'<div>'+recipeHtml(b.kind)+'</div>':'')+'<div>'+BHELP[id]+'</div></div>';
  });
  h+='<div class="rec"><b>Maják</b> <span class="tm">vpravo dole, od levelu 4 uprostřed pravého okraje</span><div>Sbírá suroviny na výzkum. Až vyzkoumáš „Rozsvítit maják“, level je hotový.</div></div>';
  h+='<h3>📈 Levely</h3><ul><li>Každý level má <b>větší mapu</b>, <b>víc skal</b> a maják chce <b>víc surovin</b>. Výzkumy postupně zdražují.</li><li>Od levelu 4 stojí maják <b>uprostřed pravého okraje</b> a <b>písek leží pod ním</b>. Proud ho nahoru nedostane, takže bez <b>pump</b> (výzkum Čerpání) level nedohraješ. Ložiska jsou také menší.</li><li>Každá hra má novou mapu, ložiska jsou pokaždé jinde.</li><li>Dohraný level odemkne další.</li></ul>';
  h+='<h3>👆 Ovládání</h3><ul><li>Dole vyber nástroj, nad lištou uvidíš jeho popis a recept. Druhým klepnutím ho vypneš.</li><li>Klepni na políčko, nebo u kanálu táhni prstem.</li><li>Bez nástroje klepnutím na hráz ji otevřeš či zavřeš a na třídič změníš surovinu.</li><li>Tlačítkem ☰ hru pozastavíš, uložíš nebo začneš znovu. Hra se ukládá i sama.</li></ul>';
  h+='<h3>💡 Tipy</h3><ul><li>Začni jílem: Sběrač → Pec → dynamitem prorazit hřeben → maják. První výzkum stojí 3 cihly.</li><li>Kanálů je málo. Veď víc surovin jedním kanálem a odbočuj je třídiči.</li><li>Sklárna potřebuje písek i palivo: postav před ni dva třídiče, jeden na písek a druhý na palivo.</li><li>Dynamit šetři na místa, kudy by cesta jinak vedla daleko okolo. Když ho potřebuješ víc, postav Prachárnu.</li><li>Pumpy pracují jen polovinu času. Před stoupání dej Sklad, ať se zboží nehromadí v kanálu.</li></ul>';
  h+='<h3>🔥 Expert</h3><p>'+(profile.expert?'':'Odemkne se po dohrání prvního levelu. ')+'Hra neodpouští chyby:</p><ul><li>Maják přijme jen suroviny, které některý výzkum ještě potřebuje. Cokoliv navíc <b>ucpe kanál</b>.</li><li>Smazaná budova <b>propadne</b>. Vrátit ji jde jen do 2 s po položení (bílý kroužek).</li><li>Méně kanálů, hrází a dynamitu, víc skal.</li><li>Chodí <b>bouře</b>. Zboží v síti kanálů bez zavřené hráze se rozplaví.</li></ul>';
  return h+'</div>';
}

function startNew(m,L){newGame(m,L,(Math.random()*1e6)|0);pending=null;paused=false;running=true;save();}
function chooseLevel(m,back){
  const max=Math.max(1,profile.lvl[m]||1);
  let h='<p>'+(m==='exp'?'Expert':'Standard')+': vyber level. Vyšší level = větší mapa, víc skal, víc surovin.</p><div class="grid">';
  for(let i=1;i<=max;i++)h+='<button data-l="'+i+'" class="'+(i<max?'old':'')+'">'+i+'</button>';
  h+='</div>'+((running||pending)?'<p style="font-size:12.5px;opacity:.75">Nová hra přepíše rozehranou.</p>':'');
  show('Nová hra',h,[{label:'Zpět',fn:back}]);
  $('mBody').querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{$('msg').style.display='none';introOpen=false;startNew(m,+b.dataset.l);});
}
function chooseMode(back){
  show('Nová hra','<p>Vyber obtížnost.</p>',[
    {label:'Standard',fn:()=>chooseLevel('std',()=>chooseMode(back))},
    {label:profile.expert?'Expert':'Expert 🔒 (po dohrání levelu 1)',disabled:!profile.expert,fn:()=>chooseLevel('exp',()=>chooseMode(back))},
    {label:'Zpět',fn:back}]);
}
function openMenu(){
  if(!running)return;
  paused=true;$('res').style.display='none';
  show('Menu','<p style="text-align:center">Level '+level+' · '+(mode==='exp'?'Expert':'Standard')+' · hra je pozastavená</p>',[
    {label:'Pokračovat',fn:()=>{paused=false;}},
    {label:'Uložit hru',fn:()=>{paused=false;save();}},
    {label:'Nová hra',fn:()=>chooseMode(openMenu)},
    {label:'Návod',fn:()=>show('Návod',helpHtml(),[{label:'Zpět',fn:openMenu}])},
    {label:'Hlavní menu',fn:()=>{save();const s=serialize();running=false;paused=false;pending=s.won?null:s;showIntro();}}
  ]);
}
$('menuBtn').onclick=openMenu;
function showIntro(){
  introOpen=true;
  const btns=[];
  if(pending&&!pending.won)btns.push({label:'Pokračovat (level '+pending.level+(pending.mode==='exp'?', Expert':'')+')',fn:()=>{restore(pending);pending=null;paused=false;running=true;}});
  btns.push({label:'Nová hra',fn:()=>chooseMode(showIntro)});
  btns.push({label:'Návod',fn:()=>show('Návod',helpHtml(),[{label:'Zpět',fn:showIntro}])});
  show('Tidewright',
   '<div class="story">'+
   '<p>Když moře spolklo starý přístav, zhasl i maják na útesu. Od té doby lodě bloudí v mlze a rybáři se nevracejí domů.</p>'+
   '<p>Ty jsi poslední <b>Tidewright</b>, stavitel, který rozumí přílivu. Proud se každou chvíli obrací a ty z něj uděláš svého pomocníka. Povede tvůj jíl, písek i řasu. V pecích budeš pálit cihly, tavit sklo a z moře sbírat sůl.</p>'+
   '<p>Každé pobřeží je jiné. Jedno hlídají skály, jiné skrývá poklady hluboko pod hladinou. Ale každé čeká na své světlo.</p>'+
   '<p class="end">Rozsviť maják.</p></div>'+
   '<p class="meta">Hraješ poprvé? Otevři <b>Návod</b>. Nejvyšší odemčený level: '+profile.lvl.std+(profile.expert?' · Expert: '+profile.lvl.exp:'')+'</p>',btns);
  introOpen=true;
}
addEventListener('resize',resize);

newGame('std',1,1);showIntro();

let last=performance.now();
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;time+=dt;
  if(running&&!won&&!paused){tick(dt);if(time-lastSave>20){lastSave=time;save();}}
  hud();draw(dt);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
